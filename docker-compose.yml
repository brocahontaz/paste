services:
  paste:
    # Pulled from GHCR on the host; `--build` still overrides it for local dev.
    image: ghcr.io/brocahontaz/paste:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      PASTE_DB_PATH: /data/paste.db
    volumes:
      - paste-data:/data
    restart: unless-stopped
    healthcheck:
      # Exec form, no shell: the distroless image has none.
      test: ["CMD", "/paste", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  paste-data:
